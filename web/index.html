<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <svg class="logo" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="3" y="5" width="30" height="26" rx="7" fill="#F5B800"/><rect x="7" y="9" width="22" height="9" rx="2.5" fill="#0F1720"/><circle cx="11" cy="24" r="2.2" fill="#0F1720"/><circle cx="25" cy="24" r="2.2" fill="#0F1720"/></svg>
      <div class="wordmark">
        <h1>Talis</h1>
        <span id="today" class="subtitle">Bus attendance</span>
      </div>
      <span id="live" class="live" data-state="connecting" role="status">Connecting</span>
    </header>

    <p id="notice" class="notice" hidden></p>

    <ul id="counts" class="counts" aria-label="Today's counts"></ul>

    <div class="columns">
      <section class="seat-map" aria-labelledby="seat-map-title">
        <div class="section-head">
          <h2 id="seat-map-title">Seat map</h2>
          <ul id="legend" class="legend" aria-label="Legend">
            <li><span class="swatch swatch-empty"></span>Empty</li>
          </ul>
        </div>
        <div class="bus">
          <div class="bus-end">Front</div>
          <ol id="bus-grid" class="bus-grid" aria-label="Seats, front to back"></ol>
          <div class="bus-end">Back</div>
        </div>
      </section>

      <section class="riders" aria-labelledby="riders-title">
        <h2 id="riders-title">All riders</h2>
        <ul id="rider-list" class="rider-list"></ul>
      </section>
    </div>
  </div>

  <dialog id="details" class="sheet" aria-labelledby="details-name">
    <div class="sheet-body">
      <h2 id="details-name"></h2>
      <p id="details-seat" class="sheet-seat"></p>
      <p id="details-status"></p>
      <p id="details-time" class="sheet-time"></p>
      <button type="button" id="details-close" class="btn">Close</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
